          package com.jara.ai

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class JaraService : AccessibilityService() {

              companion object {
                  var instance: JaraService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun goHome(): Boolean = performGlobalAction(GLOBAL_ACTION_HOME)

              fun goBack(): Boolean = performGlobalAction(GLOBAL_ACTION_BACK)

              fun openApp(name: String): Boolean {
                  val pm = packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(main, 0)
                  val match = apps.firstOrNull {
                      it.loadLabel(pm).toString().contains(name, ignoreCase = true)
                  } ?: return false
                  val launch = pm.getLaunchIntentForPackage(match.activityInfo.packageName) ?: return false
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(launch)
                  return true
              }

              fun clickByText(text: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  var node: AccessibilityNodeInfo? = root.findAccessibilityNodeInfosByText(text)?.firstOrNull()
                  while (node != null && !node.isClickable) {
                      node = node.parent
                  }
                  return node?.performAction(AccessibilityNodeInfo.ACTION_CLICK) ?: false
              }

              fun typeText(text: String): Boolean {
                  val node = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scrollDown(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  return findScrollable(root)?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD) ?: false
              }

              private fun findScrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val found = findScrollable(n.getChild(i))
                      if (found != null) return found
                  }
                  return null
              }

              fun screenTexts(): String {
                  val out = LinkedHashSet<String>()
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || out.size >= 60) return
                      val t = n.text?.toString() ?: n.contentDescription?.toString()
                      if (!t.isNullOrBlank()) out.add(t.take(40))
                      for (i in 0 until n.childCount) {
                          walk(n.getChild(i))
                      }
                  }
                  walk(rootInActiveWindow)
                  return out.joinToString(" | ")
              }
          }
