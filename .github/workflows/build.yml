          cat > app/src/main/java/com/jara/ai/JaraBrain.kt <<'JARA_EOF'
          package com.jara.ai

          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import okhttp3.Response
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          object JaraBrain {

              private val client = OkHttpClient.Builder()
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              private const val SYSTEM = """You are Jara AI, a voice assistant that controls an Android phone.
          The user speaks Hindi or Hinglish. Convert the request into a JSON array of actions.
          Output ONLY the JSON array, nothing else.
          Available actions:
          {"a":"open","t":"English app name, e.g. WhatsApp"}
          {"a":"click","t":"exact text visible on screen"}
          {"a":"type","t":"text to type into the focused field"}
          {"a":"scroll"}
          {"a":"home"}
          {"a":"back"}
          {"a":"say","t":"short reply in Hindi for the user"}
          If the user only asks a question or chats, return a single say action with the answer.
          Keep action lists short."""

              fun think(
                  apiKey: String,
                  userText: String,
                  screen: String,
                  onResult: (List<JSONObject>) -> Unit,
                  onError: (String) -> Unit
              ) {
                  val content = "User said: $userText\nCurrent screen texts: $screen"
                  val body = JSONObject()
                      .put("model", "claude-sonnet-5-5")
                      .put("max_tokens", 600)
                      .put("system", SYSTEM)
                      .put(
                          "messages",
                          JSONArray().put(JSONObject().put("role", "user").put("content", content))
                      )
                      .toString()
                      .toRequestBody("application/json".toMediaType())

                  val req = Request.Builder()
                      .url("https://api.anthropic.com/v1/messages")
                      .header("x-api-key", apiKey)
                      .header("anthropic-version", "2023-06-01")
                      .post(body)
                      .build()

                  client.newCall(req).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          onError("Internet error: " + e.message)
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val raw = response.body?.string() ?: ""
                          if (!response.isSuccessful) {
                              onError("Error " + response.code + ": " + raw.take(200))
                              return
                          }
                          try {
                              val reply = JSONObject(raw)
                                  .getJSONArray("content")
                                  .getJSONObject(0)
                                  .getString("text")
                              val start = reply.indexOf('[')
                              val end = reply.lastIndexOf(']')
                              val arr = JSONArray(reply.substring(start, end + 1))
                              val list = ArrayList<JSONObject>()
                              for (i in 0 until arr.length()) {
                                  list.add(arr.getJSONObject(i))
                              }
                              onResult(list)
                          } catch (e: Exception) {
                              onError("Samajh nahi aaya: " + e.message)
                          }
                      }
                  })
              }
          }
          JARA_EOF
